[project]
name = "sc-gateway"
version = "1.1.0"
description = "ScreenConnect Gateway: one REST API over both ScreenConnect APIs, for Rewst"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pyotp>=2.10.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sc-gateway = "gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
